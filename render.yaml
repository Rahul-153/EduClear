# Render Blueprint: one Docker web service (API + built React app) and a Postgres database.
# Secrets are never stored here: fill the `sync: false` values in the Render dashboard.
services:
  - type: web
    name: educlear
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: INR_TO_USD_RATE
        value: "0.0120"
      - key: DATABASE_URL
        fromDatabase:
          name: educlear-db
          property: connectionString
      # Accounts: production = Secure cookie, no demo code, sign-in off until a real mail provider exists (guests keep working)
      - key: ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_COUNSELLOR_PAYOUT_EMAIL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
databases:
  - name: educlear-db
    plan: free
